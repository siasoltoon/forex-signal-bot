name: TASK-062 apply

on:
  push:
    paths:
      - .github/workflows/task062_apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TASK-062 fix and regression coverage
        shell: python
        run: |
          from pathlib import Path

          confidence = Path("analysis/confidence_engine.py")
          text = confidence.read_text()
          old = '''            "supply_demand": self.normalize_signed_score(\n                self._get(\n                    analysis,\n                    "trend_score",\n                    0.0,\n                )\n            ),'''
          new = '''            "supply_demand": self.normalize_signed_score(\n                self._get(\n                    analysis,\n                    "supply_demand_score",\n                    0.0,\n                )\n            ),'''
          if old not in text:
              raise SystemExit("Expected TASK-062 confidence mapping not found")
          confidence.write_text(text.replace(old, new, 1))

          test = Path("tests/test_confidence_score_contract.py")
          text = test.read_text()
          old = '''    assert scores["price_action"] == 50.0\n    assert scores["supply_demand"] == 40.0\n'''
          new = '''    assert scores["price_action"] == 50.0\n    assert scores["supply_demand"] == 50.0\n\n\ndef test_supply_demand_uses_explicit_score_when_available():\n    class ExplicitSupplyDemandAnalysis(SignedAnalysis):\n        supply_demand_score = -20\n\n    engine = ConfidenceEngine()\n    scores = engine._collect_engines(ExplicitSupplyDemandAnalysis())\n    assert scores["supply_demand"] == 40.0\n'''
          if old not in text:
              raise SystemExit("Expected TASK-062 confidence regression fixture not found")
          test.write_text(text.replace(old, new, 1))

          Path("TASK-062.md").write_text(
              "TASK-062 temporary verification marker; removed after synchronization.\n"
          )

      - name: Run focused regression
        run: |
          python -m pytest -q tests/test_confidence_score_contract.py tests/test_confidence_engine.py

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/confidence_engine.py tests/test_confidence_score_contract.py TASK-062.md .github/workflows/task062_apply.yml
          git commit -m "fix: prevent confidence supply-demand score aliasing"
          git push origin HEAD:main

# TASK-062 execution trigger revision.
