name: Test

on:
  push:
    branches:
      - main
      - chore/explicit-provider-contract

  pull_request:

permissions:
  contents: write

jobs:
  test:

    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run pytest
        run: |
          pip install pytest
          pytest -q


      - name: Application health test
        run: |
          python -c "from app import create_app; app = create_app(); print(app.health())"


      - name: Telegram bot import test
        run: |
          python -c "from telegram_bot.bot import get_bot_token; print('Telegram module OK')"


      - name: Syntax check
        run: |
          python -m compileall .

      - name: Automation runner patch probe
        if: >-
          (github.event_name == 'pull_request' && github.head_ref == 'chore/explicit-provider-contract' && github.event.pull_request.head.repo.full_name == github.repository)
          ||
          (github.event_name == 'push' && github.ref_name == 'chore/explicit-provider-contract' && !startsWith(github.event.head_commit.message, 'chore: automation runner probe'))
        uses: actions/checkout@v4
        with:
          ref: chore/explicit-provider-contract
          fetch-depth: 0

      - name: Automation runner write probe
        if: >-
          (github.event_name == 'pull_request' && github.head_ref == 'chore/explicit-provider-contract' && github.event.pull_request.head.repo.full_name == github.repository)
          ||
          (github.event_name == 'push' && github.ref_name == 'chore/explicit-provider-contract' && !startsWith(github.event.head_commit.message, 'chore: automation runner probe'))
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p automation
          cat > automation/runner_probe.txt <<EOF
Automation Runner via Test workflow
run_id=$RUN_ID
runner_commit=$(git rev-parse HEAD)
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/runner_probe.txt
          git commit -m 'chore: automation runner probe'
          git push origin chore/explicit-provider-contract
