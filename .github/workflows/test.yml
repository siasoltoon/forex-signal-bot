name: Test

on:
  push:
    branches:
      - main
      - chore/explicit-provider-contract
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run lifecycle and persistence tests
        run: |
          pytest -q tests/test_lifecycle_features.py
      - name: Run full test suite
        run: |
          pytest -q
      - name: Application health test
        run: |
          python -c "from app import create_app; app = create_app(); print(app.health())"
      - name: Telegram bot import test
        run: |
          python -c "from telegram_bot.bot import get_bot_token; print('Telegram module OK')"
      - name: Signal lifecycle import test
        run: |
          python -c "from services.telegram.tracker import track_report, refresh_tracking; from services.telegram.journal_store import JournalStore; print('Lifecycle modules OK')"
      - name: Syntax check
        run: |
          python -m compileall .
