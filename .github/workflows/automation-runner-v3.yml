name: Automation Runner v3

on:
  push:
    branches:
      - chore/explicit-provider-contract

permissions:
  contents: write

jobs:
  runner-probe:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: automation runner probe') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runner
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Python: $(python --version)"
          echo "Git: $(git --version)"
          git status --short
          git rev-parse HEAD

      - name: Modify repository from runner
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p automation
          cat > automation/runner_probe.txt <<EOF
Automation Runner v3 probe
run_id=$RUN_ID
runner_commit=$(git rev-parse HEAD)
EOF

      - name: Commit and push runner change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/runner_probe.txt
          git commit -m 'chore: automation runner probe'
          git push origin chore/explicit-provider-contract
