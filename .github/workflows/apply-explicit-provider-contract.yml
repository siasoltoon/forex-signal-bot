name: Apply explicit provider contract

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    paths:
      - .github/workflows/apply-explicit-provider-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No-op trigger
        run: echo "explicit provider contract runner trigger"

