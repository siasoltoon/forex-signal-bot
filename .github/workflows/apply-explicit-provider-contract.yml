name: Apply explicit provider contract

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    paths:
      - .github/workflows/apply-explicit-provider-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Verify runner write path
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Python: $(python --version)"
          echo "Git: $(git --version)"
          echo "HEAD: $(git rev-parse HEAD)"
          mkdir -p automation
          cat > automation/runner_probe.txt <<EOF
Automation Runner write probe
run_id=$RUN_ID
head=$(git rev-parse HEAD)
EOF
          git status --short

      - name: Commit and push probe
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/runner_probe.txt
          git commit -m 'chore: automation runner probe'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
