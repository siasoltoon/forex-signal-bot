name: Production Activation Validation

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  activation-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall core tests
      - name: Activation validation tests
        run: python -m pytest -q tests/test_production_activation_report.py
